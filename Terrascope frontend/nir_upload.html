<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>NIR Upload – TerraScope</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js"></script>
    <style>
        body {
            background: var(--bg-page);
            color: var(--text-primary);
            transition: background 0.3s;
        }

        .upload-shell {
            max-width: 600px;
            margin: 60px auto;
            padding: 0 24px;
            text-align: center;
        }

        .instruction-card {
            background: var(--bg-card);
            border: 1.5px solid var(--border-col);
            border-radius: 32px;
            padding: 40px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.12);
            margin-top: 32px;
        }

        .preview-box {
            width: 100%;
            aspect-ratio: 1/1;
            background: var(--bg-card-2);
            border: 2px dashed var(--border-col);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            margin: 24px 0;
            transition: all 0.3s ease;
        }

        .preview-box:hover {
            border-color: var(--accent);
            background: var(--accent-soft);
        }

        .preview-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #analyzeBtn {
            width: 100%;
            padding: 18px;
            border-radius: 18px;
            font-weight: 800;
            font-size: 17px;
            box-shadow: 0 12px 30px var(--accent-soft);
            cursor: pointer;
            border: none;
        }

        #analyzeBtn.disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        /* Loading Overlay Fix for Dark Mode */
        #loadingOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }
    </style>
</head>

<body data-auth="required">
    <header class="navbar">
        <div class="logo" onclick="location.href='index.html'" style="cursor:pointer">
            <h1>TerraScope</h1>
            <span data-key="tagline">NIR Analysis</span>
        </div>
        <div class="nav-right">
            <a href="index.html" class="nav-link" data-key="back_home">← Cancel</a>
            <button id="themeToggle" onclick="toggleTheme()"></button>
        </div>
    </header>

    <div class="upload-shell">
        <h1 data-key="nir_upload_title" style="font-size:36px; font-weight:900; letter-spacing:-1px;">Ground NIR Scan
        </h1>
        <p data-key="nir_upload_sub" style="color:var(--text-secondary); margin-top:8px;">Capture and upload the
            specific NIR photo of your crop.</p>

        <div class="instruction-card">
            <div class="preview-box" id="dropZone" onclick="document.getElementById('nirInput').click()">
                <div id="uploadPrompt">
                    <div style="font-size:64px; margin-bottom:16px;">📸</div>
                    <p data-key="nir_prompt" style="font-weight:700; font-size:16px;">Tap to upload NIR camera photo</p>
                </div>
                <img id="leafPreview" style="display:none">
            </div>
            <input type="file" id="nirInput" accept="image/*" style="display:none" onchange="handleFileSelect(event)">

            <button id="analyzeBtn" class="cta-primary disabled" onclick="triggerNirAnalysis()"
                data-key="nir_analyze_btn">Analyze Leaf Health →</button>
        </div>
    </div>

    <div id="loadingOverlay">
        <div class="lo-spin"></div>
        <h2 data-key="nir_processing" style="margin-top:24px;">AI is Analyzing Cellular Health...</h2>
        <p data-key="nir_wait" style="opacity:0.7">This usually takes 2-3 seconds</p>
    </div>

    <script src="js/lang.js"></script>
    <script src="js/nir.js"></script>
    <script>
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('leafPreview').src = e.target.result;
                document.getElementById('leafPreview').style.display = 'block';
                document.getElementById('uploadPrompt').style.display = 'none';
                document.getElementById('analyzeBtn').classList.remove('disabled');
                localStorage.setItem('nir_image_preview', e.target.result);
            };
            reader.readAsDataURL(file);
        }

        async function triggerNirAnalysis() {
            const input = document.getElementById('nirInput');
            if (input.files.length === 0) return;

            document.getElementById('loadingOverlay').style.display = 'flex';

            try {
                const result = await uploadNirImage({ target: { files: input.files } });

                if (result && result.error === 'invalid_specimen') {
                    document.getElementById('loadingOverlay').style.display = 'none';
                    alert(result.message || t('error_invalid_specimen'));
                }
            } catch (err) {
                console.error(err);
                alert(t('analysis_failed'));
                document.getElementById('loadingOverlay').style.display = 'none';
            }
        }
    </script>
</body>

</html>
